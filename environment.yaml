# Development environment: tools to build and test phenomenal from a checkout.
# Runtime and documentation dependencies are in conda/run_deps.yml and
# doc/doc_deps.yml, and the package itself is installed separately:
#
#   mamba create -n phenomenal_dev -f environment.yaml -f conda/run_deps.yml -f doc/doc_deps.yml
#   mamba activate phenomenal_dev
#   pip install -e .
channels:
  - openalea3
  - conda-forge
dependencies:
  - python
  - pip
  # test
  - pytest
  # notebooks
  - ipython
  - notebook
