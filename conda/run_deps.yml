# Runtime dependencies: read by conda/meta.yaml and added to the development
# environment (see environment.yaml). Python is declared by those files.
channels:
  - openalea3
  - conda-forge
dependencies:
  - numpy
  - scipy
  - pillow
  - scikit-image
  - scikit-learn
  - networkx
  - vtk
  - orjson
  - skan
  - k3d
  - dracopy
  - opencv
  - matplotlib-base
