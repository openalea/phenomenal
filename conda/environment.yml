# Development environment: tools to build and test phenomenal from a checkout.
# Runtime and documentation dependencies are in conda/run_deps.yml and
# conda/doc_deps.yml, and the package itself is installed separately:
#
#   mamba create -n phenomenal_dev -f conda/environment.yml -f conda/run_deps.yml -f conda/doc_deps.yml
#   mamba activate phenomenal_dev
#   pip install -e . --no-build-isolation
name: phenomenal_dev
channels:
  - openalea3/label/dev
  - openalea3/label/rc
  - openalea3
  - conda-forge
dependencies:
  # highest version built by CI
  - python=3.14
  - pip
  # build
  - cxx-compiler
  - setuptools
  - setuptools-scm
  - cython
  # the Windows scikit-image 0.26.0 package ships a broken pythran folder that crashes
  # Cython; a real pythran replaces it. Remove once conda-forge fixes that package.
  - pythran
  # test
  - pytest
  # notebooks
  - notebook
