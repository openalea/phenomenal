version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "miniconda-latest"
  jobs:
    post_create_environment:
      - conda env update --name $CONDA_DEFAULT_ENV --file conda/doc_deps.yml

conda:
  environment: conda/environment_rtd.yml

sphinx:
  # Path to your Sphinx configuration file.
  configuration: doc/conf.py
