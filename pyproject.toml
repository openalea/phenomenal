# Dependencies are declared with conda: conda/run_deps.yml (runtime), conda/meta.yaml
# (package build), doc/doc_deps.yml (documentation) and environment.yaml (development).
# Install a checkout with `pip install -e . --no-deps --no-build-isolation` from the
# development environment, as for the compiled OpenAlea packages.
# `requires` only lets an isolated pip build compile the package, which then has no
# declared runtime dependencies.
[build-system]
requires = [
  "setuptools",
  "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false # force explicit declaration of data (disable automatic inclusion)

# enable dynamic version based on git tags
[tool.setuptools_scm]

[project]
name = "openalea.phenomenal"
authors = [
  { name = "Simon Artzet"},
  { name = "Christian Fournier"},
  { name = "Mielewczik Michael"},
  { name = "Brichet Nicolas"},
  { name = "Chopard Jerome"},
  { name = "Christophe Pradal"},
  { name = "Benoit Daviet"},
]
description = "An automatic open source library for 3D shoot architecture reconstruction and analysis for image-based plant phenotyping"
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
license = "CECILL-C"
license-files = ["LICEN[CS]E*"]
dynamic = ["version", "readme"]

dependencies = [
  # run dependencies are handled by conda, see /conda/run_deps.yml
]

[project.optional-dependencies]
# doc dependencies are handled by conda, see doc/doc-deps.yml
test = ["pytest"]
devel = [
  "ipython",
  "notebook",
  "pandas",
  #not available on pypy, to be installed manually (see README.md)
  #openalea.phenotyping_data
  ]
all = [
  "pytest",
  "ipython",
  "notebook",
]


[project.urls]
Homepage = "https://openalea.readthedocs.io/"
"Bug Tracker" = "https://github.com/openalea/phenomenal/issues"
Discussions = "https://github.com/openalea/phenomenal/discussions"
Changelog = "https://github.com/openalea/phenomenal/releases"

[project.entry-points."wralea"]
"openalea.phenomenal" = "openalea.phenomenal_wralea"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}
